<svg xmlns="http://www.w3.org/2000/svg" width="560" height="610" viewBox="0 0 560 610" role="img" aria-labelledby="title desc">
  <title id="title">Three places an agent's files can live</title>
  <desc id="desc">A sandbox contains local files whose durability depends on its platform. Where supported, it can mount a separate durable volume. It can also explicitly publish selected results to an external Git repository, object store, or database. These are separate storage contracts; attachable volumes are optional.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#6b625d"/></marker>
  </defs>
  <rect width="560" height="610" rx="16" fill="#fafaf8"/>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#292524">
    <text x="28" y="36" font-size="18" font-weight="600" fill="#6b625d">FILES HAVE DIFFERENT LIFETIMES</text>
    <rect x="20" y="62" width="520" height="198" rx="14" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="38" y="94" font-size="18" font-weight="600" fill="#6b625d">SANDBOX</text>
    <rect x="45" y="116" width="470" height="116" rx="10" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.5"/>
    <text x="280" y="151" text-anchor="middle" font-size="24" font-weight="600">Local files</text>
    <text x="280" y="183" text-anchor="middle" font-size="18" fill="#6b625d">Edits · dependencies · scratch data</text>
    <text x="280" y="209" text-anchor="middle" font-size="18" fill="#6b625d">Durability depends on the platform</text>
    <path d="M145 271 V351" fill="none" stroke="#6b625d" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="44" y="294" width="202" height="28" fill="#fafaf8"/>
    <text x="145" y="314" text-anchor="middle" font-size="18" fill="#6b625d">Mount, if supported</text>
    <path d="M415 271 V351" fill="none" stroke="#6b625d" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="330" y="294" width="170" height="28" fill="#fafaf8"/>
    <text x="415" y="314" text-anchor="middle" font-size="18" fill="#6b625d">Publish explicitly</text>
    <rect x="25" y="363" width="240" height="177" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="145" y="401" text-anchor="middle" font-size="22" font-weight="600" fill="#0f766e">Durable volume</text>
    <text x="145" y="438" text-anchor="middle" font-size="18" fill="#6b625d">Separate storage</text>
    <text x="145" y="464" text-anchor="middle" font-size="18" fill="#6b625d">resource and lifetime</text>
    <text x="145" y="509" text-anchor="middle" font-size="16" fill="#6b625d">Attachment rules vary</text>
    <rect x="295" y="363" width="240" height="177" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="415" y="401" text-anchor="middle" font-size="22" font-weight="600" fill="#2563eb">Published state</text>
    <text x="415" y="438" text-anchor="middle" font-size="18" fill="#6b625d">Remote Git · objects</text>
    <text x="415" y="464" text-anchor="middle" font-size="18" fill="#6b625d">Database records</text>
    <text x="415" y="509" text-anchor="middle" font-size="16" fill="#6b625d">Only what you publish</text>
    <text x="280" y="579" text-anchor="middle" font-size="17" fill="#6b625d">Recovering files does not resume running processes.</text>
  </g>
</svg>
