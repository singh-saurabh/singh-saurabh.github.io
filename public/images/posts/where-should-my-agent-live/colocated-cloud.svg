<svg xmlns="http://www.w3.org/2000/svg" width="560" height="526" viewBox="0 0 560 526" role="img" aria-labelledby="title desc">
<title id="title">A cloud agent with everything on one machine</title><desc id="desc">A web client and hosted model talk to a harness inside a task VM. The session history and execution environment also live in that VM, so machine failure can affect all three.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b625d"/></marker></defs>
<rect width="560" height="526" rx="16" fill="#fafaf8"/>
<g font-family="system-ui, -apple-system, sans-serif" fill="#292524"><rect x="32" y="24" width="222" height="68" rx="10" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.5"/><text x="143.0" y="65.0" text-anchor="middle" font-size="24" font-weight="600" fill="#a8a29e">Web client</text><rect x="306" y="24" width="222" height="68" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="417.0" y="65.0" text-anchor="middle" font-size="24" font-weight="600" fill="#2563eb">Hosted model</text><path d="M143 100 L143 216" fill="none" stroke="#6b625d" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M417 100 L417 216" fill="none" stroke="#6b625d" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="20" y="171" width="520" height="329" rx="14" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="6 5"/><text x="38" y="201" text-anchor="start" font-size="18" font-weight="600" fill="#6b625d">TASK VM</text><rect x="45" y="224" width="470" height="78" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="280.0" y="260.0" text-anchor="middle" font-size="24" font-weight="600" fill="#2563eb">Harness</text><text x="280.0" y="285.0" text-anchor="middle" font-size="18" font-weight="400" fill="#6b625d">Agent loop</text><path d="M145 310 L145 350" fill="none" stroke="#6b625d" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M400 310 L400 350" fill="none" stroke="#6b625d" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="45" y="360" width="200" height="104" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="145.0" y="409.0" text-anchor="middle" font-size="24" font-weight="600" fill="#0f766e">Session files</text><text x="145.0" y="434.0" text-anchor="middle" font-size="18" font-weight="400" fill="#6b625d">Saved on this VM</text><rect x="285" y="360" width="230" height="104" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="400.0" y="409.0" text-anchor="middle" font-size="24" font-weight="600" fill="#0f766e">Tool runner</text><text x="400.0" y="434.0" text-anchor="middle" font-size="18" font-weight="400" fill="#6b625d">Files · tests · services</text></g></svg>
