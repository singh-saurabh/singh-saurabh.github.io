<svg xmlns="http://www.w3.org/2000/svg" width="600" height="566" viewBox="0 0 600 566" role="img" aria-labelledby="title desc">
  <title id="title">Files and running processes have different lifetimes</title>
  <desc id="desc">Three example lifecycle contracts. A pause that saves memory can preserve files and process state. A stop that retains disk preserves files but requires new processes. Rebuilding restores only the files that were saved elsewhere and starts new processes. These behaviors depend on the provider and configuration; a saved process does not guarantee that its network connections survive.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#6b625d"/></marker>
  </defs>
  <rect width="600" height="566" rx="16" fill="#fafaf8"/>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#292524">
    <text x="28" y="39" font-size="23" font-weight="600">Files and processes have different lifetimes</text>
    <text x="28" y="71" font-size="19" fill="#6b625d">Example contracts — check your provider and settings.</text>

    <rect x="24" y="101" width="552" height="118" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="43" y="143" font-size="23" font-weight="600" fill="#0f766e">Pause</text>
    <text x="43" y="174" font-size="19" fill="#6b625d">Save memory</text>
    <path d="M211 157 H253" stroke="#6b625d" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="277" y="143" font-size="21" font-weight="600">Files + process state</text>
    <text x="277" y="175" font-size="19" fill="#6b625d">Resume saved execution</text>

    <rect x="24" y="236" width="552" height="118" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="43" y="278" font-size="23" font-weight="600" fill="#2563eb">Stop</text>
    <text x="43" y="309" font-size="19" fill="#6b625d">Retain disk</text>
    <path d="M211 292 H253" stroke="#6b625d" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="277" y="278" font-size="21" font-weight="600">Files only</text>
    <text x="277" y="310" font-size="19" fill="#6b625d">Start new processes</text>

    <rect x="24" y="371" width="552" height="118" rx="12" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.5"/>
    <text x="43" y="413" font-size="23" font-weight="600">Rebuild</text>
    <text x="43" y="444" font-size="19" fill="#6b625d">Restore files</text>
    <path d="M211 427 H253" stroke="#6b625d" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="277" y="413" font-size="21" font-weight="600">Only saved files return</text>
    <text x="277" y="445" font-size="19" fill="#6b625d">Start new processes</text>

    <text x="300" y="528" text-anchor="middle" font-size="19" fill="#6b625d">Clients may need to reconnect after a resume.</text>
  </g>
</svg>
