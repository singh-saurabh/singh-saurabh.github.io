<svg xmlns="http://www.w3.org/2000/svg" width="600" height="556" viewBox="0 0 600 556" role="img" aria-labelledby="title desc">
  <title id="title">Recovery stops at the last saved checkpoint</title>
  <desc id="desc">An example with asynchronous, checkpointed storage. The original machine writes patch A, then a confirmed checkpoint saves it. The machine writes patch B locally but is lost before another checkpoint. A replacement restores patch A. Patch B is absent unless it was saved separately. Storage behavior depends on the provider and configuration.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#6b625d"/></marker>
  </defs>
  <rect width="600" height="556" rx="16" fill="#fafaf8"/>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#292524">
    <text x="28" y="38" font-size="23" font-weight="600">Recovery stops at the saved checkpoint</text>
    <text x="28" y="69" font-size="18" fill="#6b625d">Example: asynchronous, checkpointed storage.</text>

    <path d="M49 154 V176 M49 240 V258 M49 322 V340 M49 404 V422" stroke="#6b625d" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

    <rect x="24" y="92" width="552" height="62" rx="10" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.5"/>
    <text x="43" y="128" font-size="20" font-weight="600">1</text>
    <text x="79" y="118" font-size="20" font-weight="600">Original machine writes patch A</text>
    <text x="79" y="142" font-size="17" fill="#6b625d">Local edit, waiting for a checkpoint</text>

    <rect x="24" y="178" width="552" height="62" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="43" y="214" font-size="20" font-weight="600" fill="#0f766e">2</text>
    <text x="79" y="204" font-size="20" font-weight="600" fill="#0f766e">Checkpoint confirmed</text>
    <text x="79" y="228" font-size="17" fill="#6b625d">Saved state now includes patch A</text>

    <rect x="24" y="260" width="552" height="62" rx="10" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.5"/>
    <text x="43" y="296" font-size="20" font-weight="600">3</text>
    <text x="79" y="286" font-size="20" font-weight="600">Original machine writes patch B</text>
    <text x="79" y="310" font-size="17" fill="#6b625d">New edit exists only on this machine</text>

    <rect x="24" y="342" width="552" height="62" rx="10" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.5"/>
    <text x="43" y="378" font-size="20" font-weight="600">4</text>
    <text x="79" y="368" font-size="20" font-weight="600">Original machine is lost</text>
    <text x="79" y="392" font-size="17" fill="#6b625d">No later checkpoint saved patch B</text>

    <rect x="24" y="424" width="552" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="43" y="465" font-size="20" font-weight="600" fill="#2563eb">5</text>
    <text x="79" y="453" font-size="20" font-weight="600" fill="#2563eb">Replacement restores checkpoint</text>
    <text x="79" y="480" font-size="18">Patch A returns. Patch B is absent.</text>

    <text x="300" y="532" text-anchor="middle" font-size="18" fill="#6b625d">Patch B needs a separate saved copy to recover.</text>
  </g>
</svg>
