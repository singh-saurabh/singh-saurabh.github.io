<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560" role="img" aria-labelledby="title desc">
<title id="title">A coding agent on your laptop</title><desc id="desc">The remote model exchanges context and tool requests with a local harness. The laptop contains session history, the harness, and tools that work on the local development environment. Local permissions still apply.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b625d"/></marker></defs>
<rect width="560" height="560" rx="16" fill="#fafaf8"/>
<g font-family="system-ui, -apple-system, sans-serif" fill="#292524"><rect x="145" y="24" width="270" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="280.0" y="56.0" text-anchor="middle" font-size="24" font-weight="600" fill="#2563eb">Hosted model</text><text x="280.0" y="81.0" text-anchor="middle" font-size="18" font-weight="400" fill="#6b625d">Remote inference</text><path d="M280 101 V153 H412 V223" fill="none" stroke="#6b625d" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="265" y="128" text-anchor="end" font-size="18" font-weight="400" fill="#6b625d">Context + tool requests</text><rect x="20" y="174" width="520" height="360" rx="14" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="6 5"/><text x="38" y="204" text-anchor="start" font-size="18" font-weight="600" fill="#6b625d">YOUR LAPTOP</text><rect x="44" y="231" width="196" height="86" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="142.0" y="271.0" text-anchor="middle" font-size="24" font-weight="600" fill="#0f766e">Session</text><text x="142.0" y="296.0" text-anchor="middle" font-size="18" font-weight="400" fill="#6b625d">Messages + results</text><rect x="310" y="231" width="204" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="412.0" y="271.0" text-anchor="middle" font-size="24" font-weight="600" fill="#2563eb">Harness</text><text x="412.0" y="296.0" text-anchor="middle" font-size="18" font-weight="400" fill="#6b625d">Model + tool loop</text><path d="M247 274 L302 274" fill="none" stroke="#6b625d" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M412 325 L412 368" fill="none" stroke="#6b625d" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="394" y="350" text-anchor="end" font-size="18" font-weight="400" fill="#6b625d">Tool calls</text><rect x="44" y="378" width="470" height="128" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="279.0" y="439.0" text-anchor="middle" font-size="24" font-weight="600" fill="#0f766e">Tools + development environment</text><text x="279.0" y="464.0" text-anchor="middle" font-size="18" font-weight="400" fill="#6b625d">Shell · files · tests · local services</text><text x="279" y="486" text-anchor="middle" font-size="17" font-weight="400" fill="#6b625d">Execution follows configured permissions</text></g></svg>
