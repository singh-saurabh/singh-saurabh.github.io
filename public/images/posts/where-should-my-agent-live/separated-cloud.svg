<svg xmlns="http://www.w3.org/2000/svg" width="560" height="726" viewBox="0 0 560 726" role="img" aria-labelledby="title desc">
<title id="title">A harness outside its execution sandbox</title><desc id="desc">Session history is stored durably outside the harness. The harness calls a hosted model and sends tool requests to an executor inside a separate sandbox. The sandbox has its own files, dependencies and processes. Workspace recovery is managed separately from session history.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b625d"/></marker></defs>
<rect width="560" height="726" rx="16" fill="#fafaf8"/>
<g font-family="system-ui, -apple-system, sans-serif" fill="#292524"><text x="28" y="34" text-anchor="start" font-size="18" font-weight="600" fill="#6b625d">HOSTED AGENT SERVICE</text><rect x="45" y="58" width="210" height="85" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="150.0" y="97.5" text-anchor="middle" font-size="24" font-weight="600" fill="#0f766e">Durable session</text><text x="150.0" y="122.5" text-anchor="middle" font-size="18" font-weight="400" fill="#6b625d">History + tool results</text><rect x="305" y="58" width="210" height="85" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="410.0" y="97.5" text-anchor="middle" font-size="24" font-weight="600" fill="#2563eb">Hosted model</text><text x="410.0" y="122.5" text-anchor="middle" font-size="18" font-weight="400" fill="#6b625d">Inference</text><path d="M150 151 L150 205" fill="none" stroke="#6b625d" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M410 151 L410 205" fill="none" stroke="#6b625d" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="45" y="215" width="470" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="280.0" y="257.0" text-anchor="middle" font-size="24" font-weight="600" fill="#2563eb">Harness</text><text x="280.0" y="282.0" text-anchor="middle" font-size="18" font-weight="400" fill="#6b625d">Context · permissions · model / tool loop</text><path d="M280 313 L280 483" fill="none" stroke="#6b625d" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="297" y="355" text-anchor="start" font-size="18" font-weight="400" fill="#6b625d">Tool requests</text><text x="297" y="379" text-anchor="start" font-size="18" font-weight="400" fill="#6b625d">and results</text><rect x="20" y="441" width="520" height="257" rx="14" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="6 5"/><text x="38" y="471" text-anchor="start" font-size="18" font-weight="600" fill="#6b625d">SANDBOX / VM</text><rect x="45" y="491" width="470" height="66" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="280.0" y="531.0" text-anchor="middle" font-size="24" font-weight="600" fill="#0f766e">Executor / tool runner</text><path d="M280 565 L280 593" fill="none" stroke="#6b625d" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="45" y="603" width="470" height="69" rx="10" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.5"/><text x="280.0" y="644.5" text-anchor="middle" font-size="24" font-weight="600" fill="#a8a29e">Files · dependencies · processes</text></g></svg>
